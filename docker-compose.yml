services:

  postgres:
    image: postgres:17-alpine
    container_name: employeehub-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - employeehub_postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - employeehub-network


  backend:
    build:
      context: ./application/backend
      dockerfile: Dockerfile

    container_name: employeehub-backend
    restart: unless-stopped

    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5000

    ports:
      - "5000:5000"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - employeehub-network


  frontend:
    build:
      context: ./application/frontend
      dockerfile: Dockerfile

    container_name: employeehub-frontend
    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      backend:
        condition: service_started

    networks:
      - employeehub-network


volumes:

  employeehub_postgres_data:
    external: true


networks:

  employeehub-network:
    driver: bridge
