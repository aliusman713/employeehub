name: EmployeeHub Security

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  gitleaks:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  trivy-filesystem:
    name: Filesystem Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true


  trivy-backend:
    name: Backend Container Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            -t employeehub-backend:security \
            ./application/backend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: employeehub-backend:security
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true


  trivy-frontend:
    name: Frontend Container Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build frontend image
        run: |
          docker build \
            -t employeehub-frontend:security \
            ./application/frontend

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: employeehub-frontend:security
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
